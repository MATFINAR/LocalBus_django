{# Fondo animado de las pantallas de acceso (registro, verificar registro). Se incluye dentro de .registro-container #}
<!-- Fondo decorativo en escenas (texto, rutas) unidas por transiciones: cortinas e iris. Lo mueve fondo_acceso.js con GSAP -->
    <div class="registro-fondo" id="registroFondo" aria-hidden="true">
        <div class="escena escena-texto" id="escTextoA">
            <div class="linea linea-sup"><span>Tu ruta</span></div>
            <div class="linea linea-inf"><span>en tiempo <b class="acento-azul">real</b></span></div>
        </div>
        <div class="escena escena-texto" id="escTextoB">
            <div class="linea linea-sup"><span>Crea tu cuenta</span></div>
            <div class="linea linea-inf"><span>y sube a <b class="acento-rojo">bordo</b></span></div>
        </div>
        <svg class="escena escena-rutas" id="escRutas" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" focusable="false">
            <path id="fondoRutaA" class="fondo-ruta" pathLength="1" stroke="#087F8C" d="M-20 780 C 260 780 300 560 560 560 S 900 700 1120 520 S 1380 180 1460 160"/>

            <path id="fondoRutaE" class="fondo-ruta" pathLength="1" stroke="#D4121A" d="M620 -20 C 700 160 900 120 980 300 S 1260 340 1300 560 S 1220 800 1260 920"/>
            <use href="#fondoRutaA" class="fondo-flujo"/>
            <use href="#fondoRutaB" class="fondo-flujo"/>
            <use href="#fondoRutaC" class="fondo-flujo"/>
            <use href="#fondoRutaD" class="fondo-flujo"/>
            <use href="#fondoRutaE" class="fondo-flujo"/>
            <g class="fondo-ondas">
                <circle class="fondo-onda" cx="560" cy="560" r="8" stroke="#087F8C" style="animation-delay:0.00s"/>

                <circle class="fondo-onda" cx="860" cy="440" r="8" stroke="#014CAB" style="animation-delay:2.10s"/>
                <circle class="fondo-onda" cx="980" cy="300" r="8" stroke="#D4121A" style="animation-delay:2.45s"/>
                <circle class="fondo-onda" cx="1300" cy="560" r="8" stroke="#D4121A" style="animation-delay:2.80s"/>

            <circle class="fondo-parada" cx="560" cy="560" r="8" stroke="#087F8C"/>

            <g class="fondo-bus" data-ruta="fondoRutaD" fill="#014CAB"><rect x="-26" y="-13" width="52" height="26" rx="3"/><text x="0" y="6" text-anchor="middle">R22</text></g>

        <div class="telones"><i class="telon telon-rojo"></i><i class="telon telon-azul"></i><i class="telon telon-negro"></i></div>
