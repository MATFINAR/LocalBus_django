<!-- home.html - Actualizado -->
{% extends "core/base.html" %}
{% load static %}

{% block title %}Mapa - {% endblock %}

{% block style %}
<link rel="stylesheet" href="{% static 'core/css/home.css' %}">
{% endblock %}

{% block content %}
<div class="home-content">
    <!-- Botones superiores -->
    <div class="home-btns">
        <button id="locateBtn" class="home-locate-btn">📍 Mi Ubicación</button>
    </div>

    <!-- Panel de búsqueda de rutas -->
    <div class="home-buscar-rutas">
        <div class="search-panel">
            <div class="search-header">
                <h3 class="search-title">
                    <span class="search-icon">🚍</span>
                    Buscar Rutas
                </h3>
                <button class="search-toggle" id="searchToggleBtn">−</button>
            </div>

            <div class="search-body" id="searchBody">
                <!-- Barra de búsqueda -->
                <div class="search-input-container">
                    <input type="text" id="routeSearchInput" class="search-input"
                        placeholder="Buscar por número, destino o ubicación..." autocomplete="off">
                    <button id="clearSearchBtn" class="search-clear-btn" style="display: none;">✕</button>
                </div>

                <!-- Filtros rápidos -->
                <div class="search-filters">
                    <button class="filter-chip active" data-filter="all">Todas</button>
                    <button class="filter-chip" data-filter="activa">Activas</button>
                    <button class="filter-chip" data-filter="cercana">Cercanas</button>
                </div>

                <!-- Contenedor de tarjetas (scroll) -->
                <div class="routes-container" id="routesContainer">
                    <div class="routes-list" id="routesList">
                        <!-- Las tarjetas se generarán dinámicamente con JS -->
                    </div>
                </div>

                <!-- Mensaje cuando no hay resultados -->
                <div class="no-results" id="noResults" style="display: none;">
                    <span class="no-results-icon">🔍</span>
                    <p>No se encontraron rutas</p>
                    <small>Intenta con otros términos de búsqueda</small>
                </div>
            </div>
        </div>
    </div>

    <!-- Mapa -->
    <div id="map" class="home-map"></div>
</div>
{% endblock %}

{% block js %}
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="{% static 'core/js/home.js' %}"></script>
{% endblock %}
